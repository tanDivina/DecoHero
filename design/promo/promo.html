<!doctype html>
<meta charset="utf-8">
<title>DecoHero promo</title>
<!-- 1080×1920 promo. Driven by frame(t) so render.mjs can step it frame by frame. Open in Chrome and add ?play to preview live. -->
<style>
  @font-face { font-family: IS; src: url("../../mobile/node_modules/@expo-google-fonts/instrument-serif/400Regular/InstrumentSerif_400Regular.ttf"); }
  @font-face { font-family: IS; font-style: italic; src: url("../../mobile/node_modules/@expo-google-fonts/instrument-serif/400Regular_Italic/InstrumentSerif_400Regular_Italic.ttf"); }
  :root { --olive: #3E5641; --deep: #2C3E2F; --lime: #E8EBE6; --plaster: #F6F7F4; --ink: #1C2321; --stone: #6E746C; --brass: #C2923F; --line: #CDD2CB; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--lime); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .serif { font-family: IS, Georgia, serif; font-weight: 400; }
  .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .layer { position: absolute; inset: 0; }
  .cap { position: absolute; top: 210px; left: 60px; right: 60px; text-align: center; font-size: 122px; line-height: 1.02; letter-spacing: -0.01em; }
  .cap .w { display: inline-block; }
  em { color: var(--olive); }

  /* 1 · logo */
  #s1 .mark { position: absolute; left: 50%; top: 330px; width: 600px; height: 866px; margin-left: -300px; }
  #s1 h1 { position: absolute; top: 1260px; width: 100%; text-align: center; font-size: 190px; line-height: 1; }
  #s1 p { position: absolute; top: 1490px; left: 140px; right: 140px; text-align: center; font-size: 62px; line-height: 1.1; color: #3a423f; }

  /* 2 · photo */
  #arch { position: absolute; left: 130px; top: 560px; width: 820px; height: 1060px; border-radius: 410px 410px 0 0; overflow: hidden; background: var(--line); }
  #arch .ph { position: absolute; inset: 0; background: url("../../test-image2.jpeg") center / cover; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #tip { position: absolute; top: 1680px; width: 100%; text-align: center; font-size: 40px; color: var(--stone); }

  /* 3 · styles */
  #chips { position: absolute; top: 600px; left: 70px; right: 70px; display: flex; flex-wrap: wrap; justify-content: center; gap: 22px; }
  .chip { position: relative; padding: 26px 40px; border-radius: 22px; background: var(--plaster); border: 3px solid var(--line); font-size: 44px; }
  .chip.on { border-color: var(--brass); background: #F3EBDD; font-weight: 700; }
  .ripple { position: absolute; left: 50%; top: 50%; width: 240px; height: 240px; margin: -120px 0 0 -120px; border-radius: 50%; background: var(--brass); opacity: 0; pointer-events: none; }
  #btn { position: absolute; left: 80px; right: 80px; top: 1580px; height: 160px; border-radius: 80px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 50px; font-weight: 600; background: #A9B4A7; }

  /* 4 · phone */
  #phone { position: absolute; left: 50%; top: 520px; width: 720px; height: 1560px; margin-left: -360px; background: var(--ink); border-radius: 96px; padding: 22px; box-shadow: 0 50px 100px rgba(28,35,33,.22); }
  #screen { width: 676px; height: 1516px; border-radius: 76px; overflow: hidden; position: relative; background: var(--lime); }
  #strip { position: absolute; top: 0; left: 0; display: flex; height: 100%; }
  #strip img { width: 676px; height: 1463px; object-fit: cover; object-position: top; display: block; }
  #tap { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(255,255,255,.55); border: 4px solid rgba(255,255,255,.9); opacity: 0; }

  /* 5 · end card */
  #panel { position: absolute; left: 0; right: 0; height: 2400px; background: var(--olive); border-radius: 540px 540px 0 0; }
  #s5 .mark { position: absolute; left: 50%; top: 300px; width: 440px; height: 635px; margin-left: -220px; }
  #s5 h1 { position: absolute; top: 1000px; width: 100%; text-align: center; color: var(--lime); font-size: 180px; line-height: 1; }
  #s5 p { position: absolute; top: 1210px; left: 120px; right: 120px; text-align: center; color: var(--lime); opacity: .85; font-size: 56px; line-height: 1.1; }
  #pills { position: absolute; top: 1420px; width: 100%; display: flex; justify-content: center; gap: 24px; }
  #pills span { border: 3px solid rgba(232,235,230,.6); color: var(--lime); border-radius: 60px; padding: 18px 36px; font-size: 38px; }
  #soon { position: absolute; top: 1660px; width: 100%; text-align: center; color: var(--brass); font-size: 34px; font-weight: 700; letter-spacing: .22em; }
</style>

<div id="s1" class="layer">
  <div class="mark"></div>
  <h1 class="serif">DecoHero</h1>
  <p class="serif">See your room in a new style <em>before</em> you buy a thing.</p>
</div>

<div id="s2" class="layer">
  <div class="cap serif" data-words="Snap|your|<em>room.</em>"></div>
  <div id="arch"><div class="ph"></div><div id="flash"></div></div>
  <div id="tip" class="sans">Stand in a corner and shoot in daylight.</div>
</div>

<div id="s3" class="layer">
  <div class="cap serif" data-words="Pick|up|to|<em>four</em>|styles."></div>
  <div id="chips" class="sans"></div>
  <div id="btn" class="sans"></div>
</div>

<div id="s4" class="layer">
  <div class="cap serif" data-words="Tap|once.|Watch|it|<em>design.</em>"></div>
  <div id="phone"><div id="screen">
    <div id="strip">
      <img src="../../store/preview/02-photo-styles.png">
      <img src="../../store/preview/04-results-loading.png">
    </div>
    <div id="tap"></div>
  </div></div>
</div>

<div id="s5" class="layer">
  <div id="panel">
    <div class="mark"></div>
    <h1 class="serif">DecoHero</h1>
    <p class="serif">See your room in a new style <em style="color:#E3C48E">before</em> you buy a thing.</p>
    <div id="pills" class="sans"><span>3 free designs</span><span>English · Español</span></div>
    <div id="soon" class="sans">COMING SOON TO GOOGLE PLAY</div>
  </div>
</div>

<script>
const DURATION = 18;
const $ = (s) => document.querySelector(s);
const clamp = (x) => Math.min(1, Math.max(0, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const out = (x) => 1 - Math.pow(1 - x, 3);
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

// The DecoHero mark (same geometry as design/mark.mjs), with handles for animating the reveal.
const ARCH = "M372,732 V432 A140,140 0 0 1 652,432 V732 Z";
const CHAIR = `<rect x="508" y="556" width="104" height="96" rx="28"/><rect x="488" y="604" width="36" height="88" rx="18"/>
  <rect x="596" y="604" width="36" height="88" rx="18"/><rect x="500" y="634" width="120" height="52" rx="16"/>
  <rect x="506" y="684" width="12" height="34" rx="5"/><rect x="602" y="684" width="12" height="34" rx="5"/>
  <rect x="557" y="292" width="6" height="118"/><path d="M528,446 a32,32 0 0 1 64,0 z"/>`;
function markSvg(id) {
  return `<svg viewBox="342 262 340 491" width="100%" height="100%">
    <defs>
      <clipPath id="${id}a"><path d="${ARCH}"/></clipPath>
      <clipPath id="${id}r"><rect class="rev" x="452" y="0" width="1024" height="1024"/></clipPath>
    </defs>
    <path class="fill" d="${ARCH}" fill="#2C3E2F"/>
    <g clip-path="url(#${id}a)"><g clip-path="url(#${id}r)">
      <rect width="1024" height="1024" fill="#E8EBE6"/>
      <g fill="#3E5641">${CHAIR}</g>
      <rect x="0" y="710" width="1024" height="22" fill="#C2923F" opacity=".35"/>
    </g></g>
    <path class="outline" d="${ARCH}" fill="none" stroke="#E8EBE6" stroke-width="18" pathLength="1" stroke-dasharray="1"/>
    <g class="handle">
      <g clip-path="url(#${id}a)"><rect x="445" y="280" width="14" height="460" fill="#C2923F"/></g>
      <circle cx="452" cy="470" r="44" fill="#C2923F"/>
      <path d="M442,452 l-16,18 l16,18 M462,452 l16,18 l-16,18" fill="none" stroke="#E8EBE6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </svg>`;
}
$("#s1 .mark").innerHTML = markSvg("m1");
$("#s5 .mark").innerHTML = markSvg("m5");
// On the light opening background the outline needs to be olive, not limewash.
$("#s1 .outline").setAttribute("stroke", "#3E5641");

function setReveal(root, hx) {
  root.querySelector(".rev").setAttribute("x", hx);
  root.querySelector(".handle").setAttribute("transform", `translate(${hx - 452} 0)`);
}

// Captions: words rise in one after another.
const caps = [...document.querySelectorAll(".cap")].map((el) => {
  el.innerHTML = el.dataset.words.split("|").map((w) => `<span class="w">${w}</span>`).join(" ");
  return [...el.querySelectorAll(".w")];
});
function words(ws, t, start) {
  ws.forEach((w, i) => {
    const k = out(p(t, start + i * 0.08, start + i * 0.08 + 0.5));
    w.style.opacity = k;
    w.style.transform = `translateY(${(1 - k) * 70}px)`;
  });
}

const STYLES = ["Tropical modern", "Minimal", "Japandi", "Scandinavian", "Mid-century", "Boho", "Coastal", "Mediterranean", "Industrial", "Classic luxury", "Farmhouse", "Art deco"];
const PICKS = [[2, 8.0], [0, 8.45], [7, 8.9]];
$("#chips").innerHTML = STYLES.map((s) => `<div class="chip">${s}<div class="ripple"></div></div>`).join("");
const chips = [...document.querySelectorAll(".chip")];

function frame(t) {
  // 1 · logo reveal
  const s1 = $("#s1");
  s1.style.opacity = 1 - p(t, 2.85, 3.2);
  s1.querySelector(".outline").style.strokeDashoffset = 1 - out(p(t, 0.1, 0.95));
  s1.querySelector(".fill").style.opacity = p(t, 0.45, 0.9);
  s1.querySelector(".handle").style.opacity = p(t, 0.8, 1.0);
  setReveal(s1, 652 - 200 * inOut(p(t, 0.95, 1.9)));
  const m1 = s1.querySelector(".mark");
  m1.style.transform = `scale(${0.92 + 0.08 * out(p(t, 0, 1.2))}) translateY(${-60 * inOut(p(t, 2.6, 3.2))}px)`;
  for (const [sel, a] of [["h1", 1.7], ["p", 2.0]]) {
    const k = out(p(t, a, a + 0.55));
    const el = s1.querySelector(sel);
    el.style.opacity = k;
    el.style.transform = `translateY(${(1 - k) * 50}px)`;
  }

  // 2 · snap your room
  $("#s2").style.opacity = p(t, 3.15, 3.35) * (1 - p(t, 6.1, 6.4));
  words(caps[0], t, 3.25);
  const open = out(p(t, 3.55, 4.3));
  $("#arch").style.clipPath = `inset(${(1 - open) * 100}% 0 0 0)`;
  $("#arch .ph").style.transform = `scale(${1.22 - 0.14 * p(t, 3.55, 6.4)})`;
  $("#flash").style.opacity = t < 3.55 ? 0 : 0.9 * (1 - p(t, 3.55, 3.95));
  $("#tip").style.opacity = out(p(t, 4.6, 5.1));

  // 3 · pick styles
  $("#s3").style.opacity = p(t, 6.35, 6.55) * (1 - p(t, 10.0, 10.3));
  words(caps[1], t, 6.45);
  chips.forEach((c, i) => {
    const k = p(t, 6.75 + i * 0.06, 6.75 + i * 0.06 + 0.4);
    const pick = PICKS.find(([n]) => n === i);
    const on = pick && t >= pick[1];
    c.classList.toggle("on", !!on);
    const bounce = on ? 0.09 * Math.sin(Math.PI * p(t, pick[1], pick[1] + 0.3)) : 0;
    c.style.opacity = k;
    c.style.transform = `scale(${0.7 + 0.3 * back(k) + bounce})`;
    const r = c.querySelector(".ripple");
    const rk = pick ? p(t, pick[1], pick[1] + 0.5) : 0;
    r.style.opacity = rk > 0 && rk < 1 ? 0.35 * (1 - rk) : 0;
    r.style.transform = `scale(${0.2 + rk})`;
  });
  const n = PICKS.filter(([, at]) => t >= at).length;
  const btn = $("#btn");
  btn.textContent = n ? `Redesign · ${n} credit${n > 1 ? "s" : ""}` : "Pick a style";
  btn.style.background = n ? "var(--olive)" : "#A9B4A7";
  btn.style.opacity = out(p(t, 7.3, 7.7));
  btn.style.transform = `scale(${1 - 0.05 * Math.sin(Math.PI * p(t, 9.5, 9.8))})`;

  // 4 · phone
  $("#s4").style.opacity = p(t, 10.25, 10.45) * (1 - p(t, 14.4, 14.7));
  words(caps[2], t, 10.35);
  $("#phone").style.transform = `translateY(${(1 - out(p(t, 10.4, 11.1))) * 1500}px)`;
  $("#strip").style.transform = `translateX(${-676 * inOut(p(t, 12.05, 12.55))}px)`;
  const tap = $("#tap");
  const tk = p(t, 11.45, 11.95);
  tap.style.left = "338px";
  tap.style.top = `${(810 / 844) * 1463}px`;
  tap.style.opacity = tk > 0 && tk < 1 ? Math.sin(Math.PI * tk) : 0;
  tap.style.transform = `scale(${0.6 + 0.5 * tk})`;

  // 5 · end card
  const rise = inOut(p(t, 14.3, 15.1));
  $("#s5").style.opacity = t >= 14.3 ? 1 : 0;
  $("#panel").style.top = `${1920 - rise * 2160}px`;
  const panelTop = 1920 - rise * 2160;
  // Keep the end-card content fixed on screen while the arch panel rises behind it.
  for (const el of document.querySelectorAll("#panel > *")) el.style.marginTop = `${-panelTop}px`;
  const m5 = $("#s5 .mark");
  const mk = back(p(t, 15.0, 15.6));
  m5.style.opacity = p(t, 15.0, 15.3);
  m5.style.transform = `scale(${0.8 + 0.2 * mk})`;
  setReveal(m5, 652 - 200 * inOut(p(t, 15.2, 16.0)));
  for (const [sel, a] of [["#s5 h1", 15.35], ["#s5 p", 15.65], ["#pills", 16.0], ["#soon", 16.4]]) {
    const k = out(p(t, a, a + 0.5));
    $(sel).style.opacity = k;
    $(sel).style.transform = `translateY(${(1 - k) * 40}px)`;
  }
}

frame(0);
if (location.search.includes("play")) {
  const t0 = performance.now();
  const loop = () => { frame(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  loop();
}
</script>
