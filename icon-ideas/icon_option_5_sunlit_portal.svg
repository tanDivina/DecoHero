<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#354B38"/>
      <stop offset="100%" stop-color="#1E2B20"/>
    </linearGradient>
    <linearGradient id="archLight" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#F7F5F0"/>
      <stop offset="100%" stop-color="#E5DFD3"/>
    </linearGradient>
    <linearGradient id="sunbeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5A93C" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C2923F" stop-opacity="0.25"/>
    </linearGradient>
    <clipPath id="archClip5">
      <path d="M282,780 V450 A230,230 0 0,1 742,450 V780 Z"/>
    </clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg5)"/>
  
  <!-- Outer subtle brass halo -->
  <path d="M266,794 V450 A246,246 0 0,1 758,450 V794 Z" fill="none" stroke="#C2923F" stroke-width="6" opacity="0.45"/>

  <!-- Main Arch Interior -->
  <g clip-path="url(#archClip5)">
    <!-- Deep recessed wall -->
    <rect width="1024" height="1024" fill="#253528"/>
    <!-- Sunlit Limewash Wall -->
    <path d="M350,200 L780,200 L780,780 L282,780 L282,520 Z" fill="url(#archLight)"/>
    <!-- Golden hour floor & beam -->
    <polygon points="360,780 742,580 742,780" fill="url(#sunbeam)"/>
    <!-- Terracotta sculptural accent vessel / lounge form -->
    <path d="M440,680 C440,605 495,575 555,575 C615,575 660,610 660,680 C660,715 635,735 595,735 L495,735 C460,735 440,715 440,680 Z" fill="#C86D51"/>
    <rect x="475" y="645" width="150" height="56" rx="28" fill="#DF8A6F"/>
    <rect x="485" y="728" width="18" height="36" rx="9" fill="#253528"/>
    <rect x="597" y="728" width="18" height="36" rx="9" fill="#253528"/>
  </g>

  <!-- Crisp Arch Frame -->
  <path d="M282,780 V450 A230,230 0 0,1 742,450 V780 Z" fill="none" stroke="#F4F1EA" stroke-width="24" stroke-linejoin="round"/>

  <!-- Signature 4-Point Brass AI Sparkle at upper left of arch -->
  <path d="M390,340 Q390,405 455,405 Q390,405 390,470 Q390,405 325,405 Q390,405 390,340 Z" fill="#E5A93C"/>
</svg>