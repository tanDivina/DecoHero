<h1>Christmas "Take out furniture": old against new removal rule</h1>
<h2>xremove-kids-desk</h2><p>Remove the desk, KEEP the chair that touches it.</p><div class=row><figure><img src="xremove-kids-desk-sent.jpg"><figcaption>marked</figcaption></figure><figure><img src="xremove-kids-desk-old.jpg"><figcaption>old rule (release/1.0.9): <b class=bad>FAIL</b> Desk gone, tree on the spot, but the unmarked chair went too.</figcaption></figure><figure><img src="xremove-kids-desk-new.jpg"><figcaption>new rule (this branch): <b class=bad>FAIL</b> Desk gone, chair gone too, and no tree at all: the worst result of the six.</figcaption></figure></div><h2>xremove-sala-loveseat</h2><p>Remove the front loveseat, KEEP the sofa behind it.</p><div class=row><figure><img src="xremove-sala-loveseat-sent.jpg"><figcaption>marked</figcaption></figure><figure><img src="xremove-sala-loveseat-old.jpg"><figcaption>old rule (release/1.0.9): <b class=ok>PASS</b> Loveseat gone, back sofa and stacked chairs kept (mostly behind the tree).</figcaption></figure><figure><img src="xremove-sala-loveseat-new.jpg"><figcaption>new rule (this branch): <b class=ok>PASS</b> Loveseat gone, back sofa and stacked chairs kept. Smaller tree.</figcaption></figure></div><h2>xremove-dining-chair</h2><p>Remove the right-hand chair, KEEP the table and the other five chairs.</p><div class=row><figure><img src="xremove-dining-chair-sent.jpg"><figcaption>marked</figcaption></figure><figure><img src="xremove-dining-chair-old.jpg"><figcaption>old rule (release/1.0.9): <b class=ok>PASS</b> Marked chair gone, table and the other chairs kept, doorway open.</figcaption></figure><figure><img src="xremove-dining-chair-new.jpg"><figcaption>new rule (this branch): <b class=ok>PASS</b> Marked chair gone, table and the other chairs kept, doorway open.</figcaption></figure></div>
